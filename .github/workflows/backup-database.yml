name: Backup database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore-check:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --schema=public --file="sentinel-$(date -u +%Y-%m-%d).dump"

      - name: Verify the backup restores
        env:
          PGPASSWORD: restore-check
        run: |
          PG_BIN=/usr/lib/postgresql/18/bin
          RESTORE_URL="postgresql://postgres@localhost:5432/postgres"
          for dump in sentinel-*.dump; do
            "$PG_BIN/pg_restore" --list "$dump" > /dev/null
            "$PG_BIN/psql" "$RESTORE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
            "$PG_BIN/pg_restore" --list "$dump" | grep -v -E ' SCHEMA - public( |$)' > restore.list
            "$PG_BIN/pg_restore" --dbname="$RESTORE_URL" --use-list=restore.list --no-owner --no-privileges --exit-on-error "$dump"
          done
          "$PG_BIN/psql" "$RESTORE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM "Organizations") = 0 THEN
              RAISE EXCEPTION 'restored backup has no organization';
            END IF;
            IF (SELECT count(*) FROM "DataProtectionKeys") = 0 THEN
              RAISE EXCEPTION 'restored backup has no Data Protection key: stored tokens could not be decrypted';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE policyname = 'tenant_isolation') THEN
              RAISE EXCEPTION 'restored backup has no row level security policy';
            END IF;
          END
          $$;
          SQL

      - name: Encrypt backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for dump in sentinel-*.dump; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output "$dump.gpg" "$dump"
            rm "$dump"
          done

      - name: Upload backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-backup-${{ github.run_id }}
          path: sentinel-*.dump.gpg
          retention-days: 7
          if-no-files-found: error
