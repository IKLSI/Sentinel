name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  CI: true

jobs:
  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Contrat temps réel à jour
        run: |
          pnpm generate:realtime
          git diff --exit-code -- src/domains/realtime/contract.gen.ts \
            || { echo "::error::contract.gen.ts est désynchronisé des constantes C#. Lancez 'pnpm generate:realtime' et committez le résultat."; exit 1; }

      - name: Lint & format (Biome CI)
        run: pnpm ci:check

      - name: Dead code (knip)
        run: pnpm lint:dead

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Test + coverage
        run: pnpm test:coverage

      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-coverage
          path: client/coverage

  server:
    name: Server — build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Sentinel.slnx

      - name: Build
        run: dotnet build Sentinel.slnx --no-restore --configuration Release

      - name: Test + Coverage
        run: >
          dotnet run --project server/tests/Sentinel.Tests/Sentinel.Tests.csproj
          --no-build --configuration Release
          --
          --results-directory ./coverage
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --report-trx --report-trx-filename test-results.trx

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-coverage
          path: ./coverage

      - name: Audit NuGet dependencies (gated)
        run: |
          output=$(dotnet list Sentinel.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -qiE "has the following vulnerable|>= "; then
            echo "::error::Des paquets NuGet vulnérables ont été détectés"
            exit 1
          fi

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
