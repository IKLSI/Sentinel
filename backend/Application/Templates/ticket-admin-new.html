<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Nouveau ticket client - Sentinel</title>
</head>
<body style="margin:0;padding:0;background-color:#080b12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#080b12;padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">

          <!-- ─── HEADER ─── -->
          <tr>
            <td style="padding-bottom:24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:13px;font-weight:700;color:#6366f1;letter-spacing:0.12em;text-transform:uppercase;">SENTINEL</span>
                  </td>
                  <td align="right">
                    <span style="font-size:11px;color:#3a4459;font-family:monospace;letter-spacing:0.05em;">TMA Platform</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ─── CARD ─── -->
          <tr>
            <td style="background-color:#0d1220;border:1px solid #1a2236;border-radius:16px;overflow:hidden;">

              <!-- Accent top bar -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="height:3px;background:linear-gradient(90deg,#f59e0b 0%,#fbbf24 50%,#d97706 100%);font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>

              <!-- Card body -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:44px 48px 40px;">

                    <!-- Event badge + title -->
                    <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                      <tr>
                        <td style="vertical-align:middle;padding-right:16px;">
                          <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#d97706,#f59e0b);text-align:center;line-height:52px;font-size:22px;display:inline-block;">🎫</div>
                        </td>
                        <td style="vertical-align:middle;">
                          <p style="margin:0;font-size:12px;color:#4a5568;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;">Action client</p>
                          <p style="margin:4px 0 0;font-size:14px;color:#fbbf24;font-weight:700;">{{EVENT_LABEL}}</p>
                        </td>
                      </tr>
                    </table>

                    <!-- Main heading -->
                    <p style="margin:0 0 8px;font-size:24px;font-weight:800;color:#f0f4ff;letter-spacing:-0.5px;line-height:1.3;">{{TICKET_TITLE}}</p>
                    <p style="margin:0 0 32px;font-size:14px;color:#6b7a99;">
                      par <span style="color:#c8d3e8;font-weight:600;">{{CLIENT_NAME}}</span> &bull; {{ORGANIZATION}}
                    </p>

                    <!-- Content preview -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:32px;background-color:#0a0f1a;border:1px solid #1a2236;border-left:3px solid #f59e0b;border-radius:8px;">
                      <tr>
                        <td style="padding:16px 20px;">
                          <p style="margin:0 0 6px;font-size:10px;font-weight:700;color:#3a4459;letter-spacing:0.1em;text-transform:uppercase;">{{CONTENT_LABEL}}</p>
                          <p style="margin:0;font-size:14px;color:#9aaccc;line-height:1.7;">{{CONTENT_PREVIEW}}</p>
                        </td>
                      </tr>
                    </table>

                    <!-- CTA Button -->
                    <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
                      <tr>
                        <td style="border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);">
                          <a href="{{TICKET_URL}}" style="display:inline-block;padding:15px 36px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;letter-spacing:0.02em;border-radius:10px;">
                            Voir le ticket &rarr;
                          </a>
                        </td>
                      </tr>
                    </table>

                    <p style="margin:0;font-size:11px;color:#2e3a4e;line-height:1.6;">
                      Lien direct : <a href="{{TICKET_URL}}" style="color:#4f5b8a;text-decoration:underline;">{{TICKET_URL}}</a>
                    </p>

                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ─── FOOTER ─── -->
          <tr>
            <td style="padding:28px 0 0;text-align:center;">
              <p style="margin:0 0 6px;font-size:11px;color:#2a3245;">Sentinel &mdash; Gestion TMA</p>
              <p style="margin:0;font-size:10px;color:#1e2a3a;">Cet email a été envoyé automatiquement, merci de ne pas y répondre.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
